<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChainRoute - Cinematic Aurora Background Loop</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body, html {
      width: 100%;
      height: 100%;
      background: #0b0d0c;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .video-container {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .vignette-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, transparent 40%, rgba(11, 13, 12, 0.75) 100%),
                  linear-gradient(to bottom, rgba(11, 13, 12, 0.4) 0%, transparent 20%, transparent 80%, rgba(11, 13, 12, 0.6) 100%);
      pointer-events: none;
    }
    .hud-card {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 24px;
      padding: 16px 28px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.2), 0 20px 40px rgba(0, 0, 0, 0.6);
      color: #e7e5e4;
      font-size: 13px;
      letter-spacing: 0.02em;
    }
    .hud-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #34d399;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: 0.05em;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #34d399;
      box-shadow: 0 0 12px #34d399;
      animation: pulse 2s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.6; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.1); }
    }
    .stat-divider {
      width: 1px;
      height: 18px;
      background: rgba(255, 255, 255, 0.15);
    }
  </style>
</head>
<body>
  <div class="video-container">
    <video id="bgVideo" autoplay loop muted playsinline preload="auto" poster="/videos/dashbg_poster.jpg">
      <source src="/videos/dashbg_clean.mp4" type="video/mp4" />
      <source src="/videos/dashbg.mp4" type="video/mp4" />
      <source src="/videos/aurora_background_1080p.mp4" type="video/mp4" />
    </video>
    <div class="vignette-overlay"></div>
  </div>

  <div class="hud-card">
    <div class="hud-pill">
      <span class="dot"></span>
      16:9 Widescreen Loop
    </div>
    <div class="stat-divider"></div>
    <span style="color: #a8a29e;">1920 × 1080 • 30 FPS • 0% Discontinuity</span>
    <div class="stat-divider"></div>
    <span style="color: #6ee7b7; font-weight: 500;">Obsidian / Olive-Sage / Mint Teal Aurora</span>
  </div>

  <script>
    const v = document.getElementById('bgVideo');
    v.play().catch(e => console.log('Autoplay policy caught:', e));
  </script>
</body>
</html>
